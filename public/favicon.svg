<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d4ed8" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Tile -->
  <rect width="64" height="64" rx="14" fill="url(#mp-grad)"/>
  
  <!-- Subtle Glass Border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Stylized Modern Building -->
  <g filter="url(#glow)">
    <!-- Main Highrise -->
    <rect x="25" y="20" width="22" height="30" rx="2" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Left Wing -->
    <rect x="17" y="28" width="10" height="22" rx="2" fill="#e2e8f0" fill-opacity="0.9"/>
    
    <!-- Roof Gable -->
    <path d="M22 20 L36 9 L50 20 Z" fill="url(#roof-grad)"/>
    
    <!-- Windows Highrise -->
    <rect x="29" y="24" width="4" height="4" rx="0.5" fill="#2563eb"/>
    <rect x="37" y="24" width="4" height="4" rx="0.5" fill="#2563eb"/>
    <rect x="29" y="31" width="4" height="4" rx="0.5" fill="#2563eb"/>
    <rect x="37" y="31" width="4" height="4" rx="0.5" fill="#2563eb"/>
    <rect x="29" y="38" width="4" height="4" rx="0.5" fill="#2563eb"/>
    <rect x="37" y="38" width="4" height="4" rx="0.5" fill="#2563eb"/>
    
    <!-- Entrance Door -->
    <rect x="32" y="44" width="8" height="6" rx="1" fill="#1e3a8a"/>

    <!-- Left Wing Windows -->
    <rect x="20" y="32" width="3" height="3" rx="0.5" fill="#3b82f6"/>
    <rect x="20" y="38" width="3" height="3" rx="0.5" fill="#3b82f6"/>
  </g>
</svg>
